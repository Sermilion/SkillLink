name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      staging_version:
        description: 'SemVer prerelease label, for example v0.1.0-staging.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.staging_version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos
            runner: [self-hosted, macOS, ARM64, skilllink]
          - platform: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release version
        shell: bash
        env:
          STAGING_VERSION: ${{ inputs.staging_version }}
        run: |
          set -euo pipefail
          raw="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$STAGING_VERSION"
          fi
          if [[ "$raw" != v* ]]; then
            raw="v$raw"
          fi
          version="${raw#v}"
          if [[ ! "$raw" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            echo "Expected vX.Y.Z or vX.Y.Z-prerelease." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$version" != *-* ]]; then
            echo "Manual release staging requires a prerelease version." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$raw" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build CLI distribution
        shell: bash
        run: ./gradlew :app:skillLinkCliDistribution "-PskilllinkVersion=${RELEASE_VERSION}" --stacktrace

      - name: Package and verify archive
        shell: bash
        run: |
          set -euo pipefail
          archive_name="skill-link-cli-${{ matrix.platform }}"
          mkdir -p release-assets
          tar -czf "release-assets/${archive_name}.tar.gz" -C app/build/skill-link-cli .
          if command -v shasum >/dev/null 2>&1; then
            (cd release-assets && shasum -a 256 "${archive_name}.tar.gz" \
              > "${archive_name}.tar.gz.sha256")
          else
            (cd release-assets && sha256sum "${archive_name}.tar.gz" \
              > "${archive_name}.tar.gz.sha256")
          fi
          tar -tzf "release-assets/${archive_name}.tar.gz" | grep -Fx './bin/skill-link'
          test -s "release-assets/${archive_name}.tar.gz.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run release checks
        run: ./gradlew check --stacktrace

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          STAGING_VERSION: ${{ inputs.staging_version }}
        run: |
          set -euo pipefail
          raw="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$STAGING_VERSION"
          fi
          if [[ "$raw" != v* ]]; then
            raw="v$raw"
          fi
          version="${raw#v}"
          if [[ ! "$raw" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$version" != *-* ]]; then
            echo "Manual release staging requires a prerelease version." >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=$raw"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tagged_commit" != "$expected_commit" ]]; then
            echo "Release tag ${RELEASE_TAG} does not point at the checked-out commit." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=()
          for platform in linux-x64 macos windows-x64; do
            expected_assets+=(
              "skill-link-cli-${platform}.tar.gz"
              "skill-link-cli-${platform}.tar.gz.sha256"
            )
          done
          for asset in "${expected_assets[@]}"; do
            [[ -f "dist/${asset}" ]] || {
              echo "Missing release asset: ${asset}" >&2
              exit 1
            }
            (
              cd dist
              if [[ "$asset" == *.tar.gz ]]; then
                sha256sum -c "${asset}.sha256"
              fi
            )
          done
          for found in dist/*; do
            [[ -f "$found" ]] || continue
            name="$(basename "$found")"
            if ! printf '%s\n' "${expected_assets[@]}" | grep -Fxq "$name"; then
              echo "Unexpected release asset: ${name}" >&2
              exit 1
            fi
          done
          test "${#expected_assets[@]}" -eq "$(find dist -maxdepth 1 -type f | wc -l)"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
          IS_STAGING: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          assets=()
          for platform in linux-x64 macos windows-x64; do
            assets+=(
              "dist/skill-link-cli-${platform}.tar.gz"
              "dist/skill-link-cli-${platform}.tar.gz.sha256"
            )
          done

          release_exists=false
          release_published=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            metadata="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft,isPrerelease,tagName \
                --jq '[.isDraft, .isPrerelease, .tagName] | @tsv'
            )"
            IFS=$'\t' read -r existing_draft existing_prerelease existing_tag <<< "$metadata"
            if [[ "$existing_tag" != "$RELEASE_TAG" || "$existing_prerelease" != "$RELEASE_PRERELEASE" ]]; then
              echo "Existing release metadata does not match the validated release." >&2
              exit 1
            fi
            if [[ "$existing_draft" != "true" ]]; then
              release_published=true
            fi
          else
            if [[ "$IS_STAGING" == "true" ]] && git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Staging tag ${RELEASE_TAG} already exists without a resumable release." >&2
              exit 1
            fi
            create_args=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "$RELEASE_TAG"
              --generate-notes
              --target "$GITHUB_SHA"
              --draft
            )
            if [[ "$IS_STAGING" != "true" ]]; then
              create_args+=(--verify-tag)
            fi
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

          existing_assets_dir="$(mktemp -d)"
          trap 'rm -rf "$existing_assets_dir"' EXIT
          uploaded_names="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | sort
          )"
          for uploaded_name in $uploaded_names; do
            if ! printf '%s\n' "${assets[@]#dist/}" | grep -Fxq "$uploaded_name"; then
              echo "Release contains an unexpected asset: ${uploaded_name}" >&2
              exit 1
            fi
          done
          for asset in "${assets[@]}"; do
            asset_name="${asset#dist/}"
            if grep -Fxq "$asset_name" <<< "$uploaded_names"; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset_name" \
                --dir "$existing_assets_dir"
              if ! cmp -s "$asset" "$existing_assets_dir/$asset_name"; then
                echo "Existing release asset differs: ${asset_name}" >&2
                exit 1
              fi
            else
              if [[ "$release_published" == "true" ]]; then
                echo "Published release is missing asset: ${asset_name}" >&2
                exit 1
              fi
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
          uploaded_names="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | sort
          )"
          for asset in "${assets[@]}"; do
            asset_name="${asset#dist/}"
            grep -Fxq "$asset_name" <<< "$uploaded_names" || {
              echo "Release is missing uploaded asset: ${asset_name}" >&2
              exit 1
            }
          done
          if [[ "$release_published" == "false" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
