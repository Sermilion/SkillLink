name: Installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            tasks: ':app:packageDeb :app:packageRpm'
          - platform: windows-x64
            os: windows-2022
            tasks: ':app:packageMsi'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm fakeroot
      - name: Build installers
        shell: bash
        env:
          PACKAGE_TASKS: ${{ matrix.tasks }}
        run: ./gradlew $PACKAGE_TASKS --stacktrace
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skilllink-${{ matrix.platform }}
          path: |
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/rpm/*.rpm
            app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Package macOS ARM64
    if: github.repository == 'Sermilion/SkillLink' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, skilllink]
    timeout-minutes: 45
    concurrency:
      group: skilllink-macmini
      cancel-in-progress: false
    steps:
      - name: Isolate Gradle state
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/skilllink-gradle" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Check and package
        run: ./gradlew check :app:packageDmg --stacktrace
      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skilllink-macos-arm64
          path: app/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports-macos-arm64
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
